<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSmart</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">


  <header class="bg-white shadow p-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-blue-600">ShopSmart</h1>
    <nav class="space-x-4">
      <a href="#" class="hover:text-blue-500">Home</a>
      <a href="wishlist.html" class="hover:text-blue-500">Wishlist </a>
      <a href="About.html"class="hover:text-blue-500">About                                                                           </a>
    </nav>
  </header>

  <section class="bg-gradient-to-r from-blue-500 to-indigo-600 text-white py-20 text-center px-4">
    <h2 class="text-4xl font-extrabold mb-4">Welcome to ShopSmart </h2>
    <p class="text-lg mb-6">Discover amazing products at unbeatable prices!</p>
    <a href="#products" class="bg-yellow-400 text-black px-6 py-3 rounded hover:bg-yellow-300 transition">Shop Now</a>
  </section>

  <section class="p-8">
    <div class="flex flex-col md:flex-row justify-center items-center gap-4 mb-6">
      <input type="text" id="searchInput" placeholder="Search products..." class="p-2 rounded border w-full md:w-64">
      <select id="categoryFilter" class="p-2 rounded border w-full md:w-48">
        <option value="">All Categories</option>
        <option value="men's clothing">Men's Clothing</option>
        <option value="women's clothing">Women's Clothing</option>
        <option value="jewelery">Jewelery</option>
        <option value="electronics">Electronics</option>
      </select>
      <button id="searchBtn" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-400">Search</button>
    </div>
  </section>

  
  <main class="p-8">
    <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
  </main>

  <footer class="bg-white shadow-inner p-6 text-center mt-10">
    <p class="text-gray-600">© 2025 ShopSmart | Created by Judith </p>
  </footer>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
